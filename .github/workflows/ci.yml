name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: License metadata consistency
        run: npm run check:license

      - name: Type check
        run: npm run typecheck

      - name: Build (dist/gkos-engine.mjs)
        run: npm run build

      - name: Tests
        run: npm test

      - name: Optional intelligence contract tests
        env:
          PYTHONPATH: services/gkos-intelligence/src
        run: python -m unittest discover -s services/gkos-intelligence/tests -v

      - name: Package contents smoke test
        run: |
          npm run pack:check
          python -m pip install --no-deps ./services/gkos-intelligence
          gkos-intelligence --help

      - name: CLI smoke test (validate + assess)
        run: |
          node bin/gkx.mjs --help
          node bin/gkx.mjs assess . --json >/dev/null
