name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      phase4_observation_expected_head:
        description: Exact lowercase 40-hex Phase 4 Observation source head
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 23, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: License metadata consistency
        run: npm run check:license

      - name: Type check
        run: npm run typecheck

      - name: Build (dist/gkos-engine.mjs)
        run: npm run build

      - name: Legacy nomenclature gate (tracked and generated release content)
        run: npm run check:nomenclature

      - name: Navigation architecture and contract gates
        run: npm run test:navigation

      - name: Tests
        run: npm test

      - name: Intelligence contract tests
        env:
          PYTHONPATH: services/gkos-intelligence/src
        run: npm run test:intelligence

      - name: Package contents smoke test
        run: |
          npm run pack:check
          python -m pip install --no-deps ./services/gkos-intelligence
          gkos-intelligence --help

      - name: CLI smoke test (validate + assess)
        run: |
          node bin/gkx.mjs --help
          node bin/gkx.mjs assess . --json >/dev/null

      - name: Bundle private Phase 4 qualification host
        run: ./node_modules/.bin/esbuild scripts/run-retrieval-observation-qualification.mjs --bundle --platform=node --format=esm --target=node22 --outfile="$RUNNER_TEMP/phase4-retrieval-qualification.mjs"

      - name: Create private Phase 4 qualification receipt root
        run: mkdir -m 700 "$RUNNER_TEMP/phase4-retrieval-qualification-node-${{ matrix.node }}"

      - name: Exact Phase 4 eval and exhaustive tune qualification
        timeout-minutes: 15
        env:
          GKOS_PHASE4_SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node "$RUNNER_TEMP/phase4-retrieval-qualification.mjs" --mode cli --artifact-root "$RUNNER_TEMP/phase4-retrieval-qualification-node-${{ matrix.node }}"

      - name: Upload bounded Phase 4 qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-retrieval-qualification-${{ runner.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/phase4-retrieval-qualification-node-${{ matrix.node }}/gkos-phase4-retrieval-qualification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Clean tracked tree after release checks
        if: always()
        run: git diff --exit-code

  windows-retrieval-path-security:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 23, 24]
    env:
      GKOS_REQUIRE_ALIAS_FIXTURE: "1"
      GKOS_REQUIRE_SHORT_PATH_FIXTURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type check and build retrieval host plane
        run: |
          npm run typecheck
          npm run build
          .\node_modules\.bin\esbuild.cmd scripts/run-retrieval-observation-qualification.mjs --bundle --platform=node --format=esm --target=node22 --outfile="$env:RUNNER_TEMP/phase4-retrieval-qualification.mjs"

      - name: Create private Windows receipt root
        shell: pwsh
        run: |
          $receiptRoot = Join-Path $env:RUNNER_TEMP "phase4-retrieval-windows-node-${{ matrix.node }}"
          New-Item -ItemType Directory -Path $receiptRoot | Out-Null

      - name: Mandatory Windows 8.3, junction, and retrieval regression
        run: node --test test/retrieval-windows-path-security.test.mjs test/retrieval-config.test.mjs test/retrieval-store.test.mjs

      - name: Exact Windows Phase 4 security qualification
        shell: pwsh
        timeout-minutes: 15
        env:
          GKOS_PHASE4_SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $receiptRoot = Join-Path $env:RUNNER_TEMP "phase4-retrieval-windows-node-${{ matrix.node }}"
          node "$env:RUNNER_TEMP/phase4-retrieval-qualification.mjs" --mode windows-security --artifact-root $receiptRoot

      - name: Upload bounded Windows security receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-retrieval-qualification-${{ runner.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/phase4-retrieval-windows-node-${{ matrix.node }}/gkos-phase4-retrieval-qualification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Clean tracked tree after Windows retrieval checks
        if: always()
        run: git diff --exit-code

  phase4-retrieval-observation-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: phase4-retrieval-observation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind exact manual observation source
        env:
          EXPECTED_SOURCE_HEAD: ${{ inputs.phase4_observation_expected_head }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          test "$GITHUB_REF" = "refs/heads/codex/phase-4-retrieval-evaluation"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type check, build, and release gates
        run: |
          npm run typecheck
          npm run build
          npm run pack:check
          git diff --exit-code

      - name: Bundle private observation runner outside the checkout
        run: ./node_modules/.bin/esbuild scripts/run-retrieval-observation-qualification.mjs --bundle --platform=node --format=esm --target=node24 --outfile="$RUNNER_TEMP/phase4-retrieval-observation.mjs"

      - name: Exact frozen pack, CLI, public, and Phase 0-3 immutability gates
        run: node "$RUNNER_TEMP/phase4-retrieval-observation.mjs" --mode immutability

      - name: Create private observation artifact root
        run: mkdir -m 700 "$RUNNER_TEMP/phase4-retrieval-observation-artifacts"

      - name: Real FTS5 10k temporal and performance observation
        env:
          GKOS_PHASE4_SOURCE_HEAD_COMMIT: ${{ inputs.phase4_observation_expected_head }}
        run: node "$RUNNER_TEMP/phase4-retrieval-observation.mjs" --mode observation --artifact-root "$RUNNER_TEMP/phase4-retrieval-observation-artifacts"

      - name: Upload bounded observation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-retrieval-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase4-retrieval-observation-artifacts/performance-sample-plan.json
            ${{ runner.temp }}/phase4-retrieval-observation-artifacts/observation-receipt.json
            ${{ runner.temp }}/phase4-retrieval-observation-artifacts/observation-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Clean tracked tree after observation
        if: always()
        run: git diff --exit-code

  phase5-watcher-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 23, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type, build, and package gates
        run: |
          npm run typecheck
          npm run build
          npm run pack:check

      - name: Focused Phase 5 watcher host suite
        run: >-
          node --test
          test/watcher-source-scan.test.mjs
          test/watcher-index-validation.test.mjs
          test/watcher-pointer-host.test.mjs
          test/watcher-journal-host.test.mjs
          test/watcher-coordinator.test.mjs
          test/watcher-service-cli.test.mjs
          test/watcher-recovery-contracts.test.mjs
          test/watcher-observation-qualification.test.mjs

      - name: Bundle private Phase 5 watcher qualification runner
        run: ./node_modules/.bin/esbuild scripts/run-watcher-observation-qualification.mjs --bundle --platform=node --format=esm --target=node22 --outfile="$RUNNER_TEMP/phase5-watcher-qualification.mjs"

      - name: Create private watcher observation root
        run: mkdir -m 700 "$RUNNER_TEMP/phase5-watcher-observation-node-${{ matrix.node }}"

      - name: Exact watcher observation qualification
        run: node "$RUNNER_TEMP/phase5-watcher-qualification.mjs" --artifact-root "$RUNNER_TEMP/phase5-watcher-observation-node-${{ matrix.node }}"

      - name: Reopen exact one-leaf observation artifact
        run: >-
          node -e "const fs=require('node:fs'),p=require('node:path').join(process.env.RUNNER_TEMP,'phase5-watcher-observation-node-${{ matrix.node }}');
          const n=fs.readdirSync(p);if(n.length!==1||n[0]!=='watcher-observation-measurement.json'||!fs.lstatSync(require('node:path').join(p,n[0])).isFile())process.exit(1)"

      - name: Upload exact watcher observation measurement
        if: always()
        uses: "actions/upload-artifact@\
          ea165f8d65b6e75b540449e92b4886f43607fa02" # v4
        with:
          name: phase5-watcher-recovery-observation-${{ runner.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/phase5-watcher-observation-node-${{ matrix.node }}/watcher-observation-measurement.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Clean tree after watcher qualification
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  phase5-watcher-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 23, 24]
    env:
      GKOS_REQUIRE_ALIAS_FIXTURE: "1"
      GKOS_REQUIRE_SHORT_PATH_FIXTURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type, build, and package gates
        run: |
          npm run typecheck
          npm run build
          npm run pack:check

      - name: Bundle private Phase 5 watcher qualification runner
        run: .\node_modules\.bin\esbuild.cmd scripts/run-watcher-observation-qualification.mjs --bundle --platform=node --format=esm --target=node22 --outfile="$env:RUNNER_TEMP/phase5-watcher-qualification.mjs"

      - name: Create private watcher observation root
        shell: pwsh
        run: New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "phase5-watcher-observation-node-${{ matrix.node }}") | Out-Null

      - name: Exact watcher observation qualification
        shell: pwsh
        run: node "$env:RUNNER_TEMP/phase5-watcher-qualification.mjs" --artifact-root (Join-Path $env:RUNNER_TEMP "phase5-watcher-observation-node-${{ matrix.node }}")

      - name: Reopen exact one-leaf observation artifact
        shell: pwsh
        run: >-
          node -e "const fs=require('node:fs'),p=require('node:path').join(process.env.RUNNER_TEMP,'phase5-watcher-observation-node-${{ matrix.node }}');
          const n=fs.readdirSync(p);if(n.length!==1||n[0]!=='watcher-observation-measurement.json'||!fs.lstatSync(require('node:path').join(p,n[0])).isFile())process.exit(1)"

      - name: Upload exact watcher observation measurement
        if: always()
        uses: "actions/upload-artifact@\
          ea165f8d65b6e75b540449e92b4886f43607fa02" # v4
        with:
          name: phase5-watcher-recovery-observation-${{ runner.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/phase5-watcher-observation-node-${{ matrix.node }}/watcher-observation-measurement.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Focused Phase 5 watcher host suite
        run: >-
          node --test --test-concurrency=1
          test/watcher-source-scan.test.mjs
          test/watcher-index-validation.test.mjs
          test/watcher-pointer-host.test.mjs
          test/watcher-journal-host.test.mjs
          test/watcher-coordinator.test.mjs
          test/watcher-service-cli.test.mjs
          test/watcher-recovery-contracts.test.mjs

      - name: Watcher observation archive audit unit test
        run: >-
          node --test
          --test-name-pattern="terminal watcher observation audit accepts all-and-only six exact governed lanes"
          test/watcher-observation-qualification.test.mjs

      - name: Clean tree after watcher qualification
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code
          if (git status --porcelain --untracked-files=all) { exit 1 }

  phase5-watcher-artifact-audit:
    needs: [phase5-watcher-linux, phase5-watcher-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: "0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact current-run artifact authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = [
            'phase5-watcher-recovery-observation-Linux-node-22',
            'phase5-watcher-recovery-observation-Linux-node-23',
            'phase5-watcher-recovery-observation-Linux-node-24',
            'phase5-watcher-recovery-observation-Windows-node-22',
            'phase5-watcher-recovery-observation-Windows-node-23',
            'phase5-watcher-recovery-observation-Windows-node-24',
          ].sort();
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const eventName = process.env.GITHUB_EVENT_NAME;
          const eventPayload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const admittedEvents = new Set(['push', 'pull_request', 'workflow_dispatch']);
          const expectedHead = eventName === 'pull_request'
            ? eventPayload.pull_request?.head?.sha
            : process.env.GITHUB_SHA;
          if (!admittedEvents.has(eventName) || !/^[0-9a-f]{40}$/u.test(expectedHead ?? '')
              || eventPayload.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('GKX_WATCHER_ARTIFACT_EVENT_INVALID');
          }
          const request = async (path) => {
            const response = await fetch(`${base}${path}`, { headers });
            if (!response.ok) throw new Error(`GKX_WATCHER_ARTIFACT_API_${response.status}`);
            return response.json();
          };
          const runId = Number(process.env.GITHUB_RUN_ID);
          const run = await request(`/actions/runs/${runId}`);
          if (run.id !== runId || run.head_sha !== expectedHead
              || run.event !== eventName
              || run.path !== '.github/workflows/ci.yml'
              || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('GKX_WATCHER_ARTIFACT_RUN_INVALID');
          }
          const response = await request(`/actions/runs/${runId}/artifacts?per_page=100`);
          const artifacts = response.artifacts ?? [];
          const prefix = 'phase5-watcher-recovery-observation-';
          const selected = artifacts.filter((artifact) => artifact.name.toLowerCase().startsWith(prefix));
          const names = selected.map((artifact) => artifact.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)
              || selected.length !== 6
              || selected.some((artifact) => artifact.expired === true || artifact.size_in_bytes < 1
                || artifact.workflow_run?.id !== runId || artifact.workflow_run?.head_sha !== expectedHead)) {
            throw new Error('GKX_WATCHER_ARTIFACT_SET_INVALID');
          }
          NODE

      - name: Install and bundle private terminal auditor
        run: |
          npm ci
          npm run typecheck
          npm run build
          ./node_modules/.bin/esbuild scripts/run-watcher-observation-qualification.mjs --bundle --platform=node --format=esm --target=node22 --outfile="$RUNNER_TEMP/phase5-watcher-qualification.mjs"

      - name: Download exact six watcher observation archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phase5-watcher-recovery-observation-*
          path: ${{ runner.temp }}/phase5-watcher-observation-archives
          merge-multiple: false

      - name: Reseal and audit every watcher observation archive
        run: node "$RUNNER_TEMP/phase5-watcher-qualification.mjs" --archive-root "$RUNNER_TEMP/phase5-watcher-observation-archives"

      - name: Clean tree after terminal watcher audit
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
