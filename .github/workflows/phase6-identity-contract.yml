name: GKOS Phase 6 identity contract qualification

on:
  push:
    branches: [codex/phase6-f1-contract-pack]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_OPTIONS: --disable-warning=ExperimentalWarning
  CONTRACT_ROOT: contracts/identity/GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  p6-f1-contract-linux-node22: &contract_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run build
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check
      - name: Focused contract tests with retained counts
        shell: bash
        run: node --test test/agent-identity-mcp-contract.test.mjs 2>&1 | tee "$RUNNER_TEMP/focused.tap"
      - name: Write bound qualification receipt
        shell: bash
        run: |
          node scripts/generate-agent-identity-mcp-contract.mjs --check --receipt qualification-receipt.json --receipt-evidence qualification-evidence.json --job p6-f1-contract-linux-node22 \
            --receipt-command "npm install --global npm@10.9.4" --receipt-command "npm --version equals 10.9.4" --receipt-command "npm ci --ignore-scripts" --receipt-command "npm run typecheck" --receipt-command "npm run build" --receipt-command "node scripts/generate-agent-identity-mcp-contract.mjs --check" \
            --receipt-test-log "node --test test/agent-identity-mcp-contract.test.mjs::$RUNNER_TEMP/focused.tap" \
            --receipt-input "$CONTRACT_ROOT/pack-manifest.json" --receipt-input "$CONTRACT_ROOT/qualification-receipt.schema.json" --receipt-output "$RUNNER_TEMP/focused.tap"
      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-linux-node22-receipt
          path: |
            qualification-receipt.json
            qualification-evidence.json
            ${{ runner.temp }}/focused.tap
          retention-days: 90
          if-no-files-found: error

