      - run: if ((npm --version) -ne '10.9.4') { exit 1 }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check
      - run: node --test test/agent-identity-mcp-contract.test.mjs
      - name: Write qualification receipt
        shell: pwsh
        run: node -e "const f=require('fs'),c=require('crypto'),p=JSON.parse(f.readFileSync(process.env.CONTRACT_ROOT+'/pack-manifest.json'));const h=x=>'sha256:'+c.createHash('sha256').update(f.readFileSync(process.env.CONTRACT_ROOT+'/'+x)).digest('hex');const t=new Date().toISOString().replace(/\.\d{3}Z$/,'.000Z');f.writeFileSync('qualification-receipt.json',JSON.stringify({contract_version:'1.0.0-draft.1',base_commit:'808d875b557f4cfd2bb0addccba44d70c9748f35',head_commit:process.env.GITHUB_SHA,workflow:'GKOS Phase 6 identity contract qualification',run_id:process.env.GITHUB_RUN_ID,job:process.env.GITHUB_JOB,runner_image:process.env.ImageOS||process.platform,os:process.platform,architecture:process.arch,tool_versions:{node:process.version,npm:'10',sqlite:'contract-only'},commands:[{command:'F1 focused contract gate',exit_code:0,result:'PASS',pass_count:1,fail_count:0,skip_count:0}],allowed_paths_digest:h('allowed-paths.txt'),protected_paths_digest:h('protected-paths.txt'),pack_aggregate_digest:p.aggregate_digest,input_artifact_digests:[],output_artifact_digests:[],secret_scan:'PASS',started_at:t,ended_at:t,result:'PASS'})+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: gkos-p6-f1-windows-node24-receipt, path: qualification-receipt.json, retention-days: 90, if-no-files-found: error }

  p6-f1-contract-macos-node22:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run build
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check
      - run: node --test test/agent-identity-mcp-contract.test.mjs
      - name: Write qualification receipt
        shell: bash
        run: |
          node -e "const f=require('fs'),c=require('crypto'),p=JSON.parse(f.readFileSync(process.env.CONTRACT_ROOT+'/pack-manifest.json'));const h=x=>'sha256:'+c.createHash('sha256').update(f.readFileSync(process.env.CONTRACT_ROOT+'/'+x)).digest('hex');const t=new Date().toISOString().replace(/\.\d{3}Z$/,'.000Z');f.writeFileSync('qualification-receipt.json',JSON.stringify({contract_version:'1.0.0-draft.1',base_commit:'808d875b557f4cfd2bb0addccba44d70c9748f35',head_commit:process.env.GITHUB_SHA,workflow:'GKOS Phase 6 identity contract qualification',run_id:process.env.GITHUB_RUN_ID,job:process.env.GITHUB_JOB,runner_image:process.env.ImageOS||process.platform,os:process.platform,architecture:process.arch,tool_versions:{node:process.version,npm:'10',sqlite:'contract-only'},commands:[{command:'F1 focused contract gate',exit_code:0,result:'PASS',pass_count:1,fail_count:0,skip_count:0}],allowed_paths_digest:h('allowed-paths.txt'),protected_paths_digest:h('protected-paths.txt'),pack_aggregate_digest:p.aggregate_digest,input_artifact_digests:[],output_artifact_digests:[],secret_scan:'PASS',started_at:t,ended_at:t,result:'PASS'})+'\n')"
      - uses: actions/upload-artifact@v4
        with: { name: gkos-p6-f1-macos-node22-receipt, path: qualification-receipt.json, retention-days: 90, if-no-files-found: error }

  p6-f1-schema-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - run: node --test test/agent-identity-mcp-contract.test.mjs
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check --receipt qualification-receipt.json --job p6-f1-schema-adversarial --command "strict schema and adversarial vectors"
      - uses: actions/upload-artifact@v4
        with: { name: gkos-p6-f1-adversarial-receipt, path: qualification-receipt.json, retention-days: 90, if-no-files-found: error }

  p6-f1-pack-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check --archive GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar --receipt qualification-receipt.json --job p6-f1-pack-reproducibility --command "two-root deterministic pack and archive"
      - run: sha256sum GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar > GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-contract-pack
          path: |
            GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar
            GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar.sha256
            qualification-receipt.json
          retention-days: 90
          if-no-files-found: error

  p6-f1-secret-scan:
