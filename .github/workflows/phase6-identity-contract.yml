      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-windows-node22-receipt
          path: |
            qualification-receipt.json
            qualification-evidence.json
            ${{ runner.temp }}/focused.tap
          retention-days: 90
