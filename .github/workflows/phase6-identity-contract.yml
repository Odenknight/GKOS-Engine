      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-secret-scan-receipt
          path: |
            qualification-receipt.json
            qualification-evidence.json
            ${{ runner.temp }}/secret-scan.tap
          retention-days: 90
          if-no-files-found: error

  p6-f1-artifact-audit:
    needs: [p6-f1-contract-linux-node22,p6-f1-contract-linux-node23,p6-f1-contract-linux-node24,p6-f1-contract-windows-node22,p6-f1-contract-windows-node23,p6-f1-contract-windows-node24,p6-f1-contract-macos-node22,p6-f1-schema-adversarial,p6-f1-pack-reproducibility,p6-f1-secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/download-artifact@v4
        with: { path: predecessor-artifacts }
      - name: Execute governed terminal audit plan and write bound receipt
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          node scripts/generate-agent-identity-mcp-contract.mjs --qualification-job p6-f1-artifact-audit \
            --receipt qualification-receipt.json --receipt-evidence qualification-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-terminal-audit-receipt
          path: |
            qualification-receipt.json
            qualification-evidence.json
            terminal-audit-report.json
          retention-days: 90
          if-no-files-found: error
