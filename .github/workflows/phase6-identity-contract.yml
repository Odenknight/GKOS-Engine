        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { path: predecessor-artifacts }
      - name: Verify exact predecessor evidence and freshly extract the real pack
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';import crypto from 'node:crypto';import {execFileSync} from 'node:child_process';import Ajv2020 from 'ajv/dist/2020.js';import addFormats from 'ajv-formats';
          const hash=(bytes)=>`sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`,hashFile=(p)=>hash(fs.readFileSync(p));
          const canonical=(v)=>JSON.stringify(Array.isArray(v)?v.map((x)=>JSON.parse(canonical(x))):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map((k)=>[k,JSON.parse(canonical(v[k]))])):v);
          const root='predecessor-artifacts',contract=process.env.CONTRACT_ROOT,inventory=JSON.parse(fs.readFileSync(`${contract}/hosted-artifact-inventory.json`));
          const expected=inventory.artifacts.filter((x)=>x!=='gkos-p6-f1-terminal-audit-receipt').sort(),actual=fs.readdirSync(root,{withFileTypes:true}).filter((x)=>x.isDirectory()).map((x)=>x.name).sort();if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`artifact inventory mismatch: ${actual}`);
          const ajv=new Ajv2020({strict:true,allErrors:true,allowUnionTypes:true});addFormats(ajv);const validate=ajv.compile(JSON.parse(fs.readFileSync(`${contract}/qualification-receipt.schema.json`)));
          const committedInputs=new Set([hashFile(`${contract}/pack-manifest.json`),hashFile(`${contract}/qualification-receipt.schema.json`)]),predecessorFiles=[];
          for(const name of expected){
            const dir=path.join(root,name),files=fs.readdirSync(dir).sort();for(const file of files)predecessorFiles.push({path:`${name}/${file}`,sha256:hashFile(path.join(dir,file))});
            if(!files.includes('qualification-receipt.json')||!files.includes('qualification-evidence.json'))throw new Error(`${name}: missing bound evidence files`);
            const receipt=JSON.parse(fs.readFileSync(path.join(dir,'qualification-receipt.json'))),evidence=JSON.parse(fs.readFileSync(path.join(dir,'qualification-evidence.json')));
            if(!validate(receipt))throw new Error(`${name}: ${ajv.errorsText(validate.errors)}`);if(receipt.result!=='PASS'||receipt.head_commit!==process.env.GITHUB_SHA)throw new Error(`${name}: coordinate mismatch`);
            if(Date.parse(receipt.ended_at)<=Date.parse(receipt.started_at))throw new Error(`${name}: nonpositive evidence interval`);
            if(receipt.commands.some((x)=>x.test_count!==x.pass_count+x.fail_count+x.skip_count))throw new Error(`${name}: synthetic command counts`);
            if(receipt.cpu!==evidence.cpu||JSON.stringify(receipt.tool_versions)!==JSON.stringify(evidence.tool_versions)||JSON.stringify(receipt.commands)!==JSON.stringify(evidence.commands.map(({log_path,log_digest,...x})=>x)))throw new Error(`${name}: environment or command evidence mismatch`);
            for(const command of evidence.commands.filter((x)=>x.test_count>0)){const log=path.join(dir,path.basename(command.log_path));if(!files.includes(path.basename(log))||hashFile(log)!==command.log_digest)throw new Error(`${name}: test log binding mismatch`);}
            const outputDigests=[...new Set(files.filter((x)=>x!=='qualification-receipt.json').map((x)=>hashFile(path.join(dir,x))))].sort();if(JSON.stringify(receipt.output_artifact_digests)!==JSON.stringify(outputDigests))throw new Error(`${name}: output digest set not exact`);
            const evidenceInputs=[...new Set(evidence.input_artifacts.map((x)=>x.sha256))].sort();if(JSON.stringify(receipt.input_artifact_digests)!==JSON.stringify(evidenceInputs)||JSON.stringify(evidenceInputs)!==JSON.stringify([...committedInputs].sort()))throw new Error(`${name}: input digest set not exact`);
          }
          const packDir=path.join(root,'gkos-p6-f1-contract-pack'),base='GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar',archive=path.join(packDir,base),sidecar=fs.readFileSync(`${archive}.sha256`,'utf8'),archiveHex=hashFile(archive).slice(7);if(sidecar!==`${archiveHex}  ${base}\n`)throw new Error('pack archive sidecar mismatch');
