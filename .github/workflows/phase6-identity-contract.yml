      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm install --global npm@10.9.4
      - run: test "$(npm --version)" = "10.9.4"
      - run: npm ci --ignore-scripts
      - run: node --test --test-name-pattern="secret material" test/agent-identity-mcp-contract.test.mjs
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check --receipt qualification-receipt.json --job p6-f1-secret-scan --command "credential and secret exposure scan"
      - uses: actions/upload-artifact@v4
        with: { name: gkos-p6-f1-secret-scan-receipt, path: qualification-receipt.json, retention-days: 90, if-no-files-found: error }

  p6-f1-artifact-audit:
    needs: [p6-f1-contract-linux-node22,p6-f1-contract-linux-node23,p6-f1-contract-linux-node24,p6-f1-contract-windows-node22,p6-f1-contract-windows-node23,p6-f1-contract-windows-node24,p6-f1-contract-macos-node22,p6-f1-schema-adversarial,p6-f1-pack-reproducibility,p6-f1-secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: predecessor-artifacts }
      - name: Verify exact predecessor inventory and inner evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import Ajv2020 from 'ajv/dist/2020.js';import addFormats from 'ajv-formats';
          const root='predecessor-artifacts',inventory=JSON.parse(fs.readFileSync(process.env.CONTRACT_ROOT+'/hosted-artifact-inventory.json'));
          const expected=inventory.artifacts.filter((x)=>x!=='gkos-p6-f1-terminal-audit-receipt').sort(),actual=fs.readdirSync(root,{withFileTypes:true}).filter((x)=>x.isDirectory()).map((x)=>x.name).sort();if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`artifact inventory mismatch: ${actual}`);
          const ajv=new Ajv2020({strict:true,allErrors:true,allowUnionTypes:true});addFormats(ajv);const validate=ajv.compile(JSON.parse(fs.readFileSync(process.env.CONTRACT_ROOT+'/qualification-receipt.schema.json')));
          for(const name of expected){const dir=path.join(root,name),files=fs.readdirSync(dir).sort();if(name==='gkos-p6-f1-contract-pack'){const base='GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar';if(JSON.stringify(files)!==JSON.stringify([base,base+'.sha256','qualification-receipt.json'].sort()))throw new Error('pack artifact file inventory');const got=crypto.createHash('sha256').update(fs.readFileSync(path.join(dir,base))).digest('hex');const line=fs.readFileSync(path.join(dir,base+'.sha256'),'utf8');if(line!==`${got}  ${base}\n`)throw new Error('pack archive digest mismatch');}else if(JSON.stringify(files)!==JSON.stringify(['qualification-receipt.json']))throw new Error(`${name} file inventory`);const receipt=JSON.parse(fs.readFileSync(path.join(dir,'qualification-receipt.json')));if(!validate(receipt))throw new Error(`${name}: ${ajv.errorsText(validate.errors)}`);if(receipt.result!=='PASS'||receipt.head_commit!==process.env.GITHUB_SHA)throw new Error(`${name}: coordinate mismatch`);}
          NODE
      - name: Verify hosted all-and-only predecessor conclusions
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > hosted-jobs.json
          node -e "const x=require('./hosted-jobs.json').jobs;const expected=['p6-f1-contract-linux-node22','p6-f1-contract-linux-node23','p6-f1-contract-linux-node24','p6-f1-contract-windows-node22','p6-f1-contract-windows-node23','p6-f1-contract-windows-node24','p6-f1-contract-macos-node22','p6-f1-schema-adversarial','p6-f1-pack-reproducibility','p6-f1-secret-scan'];for(const n of expected){const j=x.find(v=>v.name===n);if(!j||j.conclusion!=='success')throw Error(n+' not successful')}if(x.filter(v=>v.name.startsWith('p6-f1-')).length!==11)throw Error('all-and-only job set mismatch')"
      - run: node scripts/generate-agent-identity-mcp-contract.mjs --check --receipt qualification-receipt.json --job p6-f1-artifact-audit --command "terminal all-and-only artifact audit"
      - uses: actions/upload-artifact@v4
        with: { name: gkos-p6-f1-terminal-audit-receipt, path: qualification-receipt.json, retention-days: 90, if-no-files-found: error }
