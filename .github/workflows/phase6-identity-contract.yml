  p6-f1-contract-macos-node22:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Execute governed qualification plan and write bound receipt
        shell: bash
        run: |
          node scripts/generate-agent-identity-mcp-contract.mjs --qualification-job p6-f1-contract-macos-node22 \
