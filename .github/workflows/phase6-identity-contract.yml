      - name: Execute governed pack qualification plan and write bound receipt
        shell: bash
        run: |
          node scripts/generate-agent-identity-mcp-contract.mjs --qualification-job p6-f1-pack-reproducibility \
            --receipt qualification-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: gkos-p6-f1-contract-pack
          path: |
            GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar
            GKOS-AGENT-IDENTITY-MCP-CONTRACT-1.0.0-draft.1.tar.sha256
            qualification-receipt.json
          retention-days: 90
          if-no-files-found: error

  p6-f1-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
