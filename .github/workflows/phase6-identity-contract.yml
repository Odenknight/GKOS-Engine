    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '23', cache: npm }
      - name: Execute governed qualification plan and write bound receipt
