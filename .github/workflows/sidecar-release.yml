name: Sidecar release

# Builds the desktop-agent SEA single binary (`kosmos-agent`) and attaches the
# binaries to the tag's GitHub Release. Binaries are UNSIGNED (build spec
# decision 1); the shell repo (GKOS-Engine-Lite) consumes them as its Tauri
# sidecar.
#
# Runner policy (issue #9): SEA cannot cross-compile across OSes, so Windows
# and macOS each build on their own runner. Across ARCHES on macOS it now can:
# both mac targets are produced on `macos-latest` (arm64), with the Intel leg
# passing `--target-arch x64` so build-sea.mjs downloads and checksum-verifies
# the official darwin-x64 node instead of copying the host binary. This removes
# all dependence on the Intel macOS runner pool, whose queue times caused the
# x86_64-apple-darwin asset to be missing from v1.0.8 and v1.0.9.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            sea_args: ""
            expect_asset: kosmos-agent-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            arch: arm64
            sea_args: ""
            expect_asset: kosmos-agent-aarch64-apple-darwin
          # Intel macOS, cross-built on the arm64 runner — no macos-13 /
          # macos-15-intel dependency. See the runner policy note above.
          - os: macos-latest
            arch: x64
            sea_args: "--target-arch x64"
            expect_asset: kosmos-agent-x86_64-apple-darwin
    name: ${{ matrix.os }} → ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          engine_version="$(sed -n 's/.*ENGINE_VERSION = "\([^"]*\)".*/\1/p' src/version.ts)"
          if [ "$tag" != "$package_version" ] || [ "$tag" != "$engine_version" ]; then
            echo "::error::tag $tag, package $package_version, and ENGINE_VERSION $engine_version must match" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Tests
        run: npm test

      - name: Build SEA binary
        run: node scripts/build-sea.mjs ${{ matrix.sea_args }}

      - name: Smoke-test SEA binary
        shell: bash
        run: |
          set -euo pipefail
          # The expected asset must exist by exact name — no globbing to
          # whatever happened to be produced, so a wrong-arch build fails here
          # instead of shipping under the right name.
          binary="dist/${{ matrix.expect_asset }}"
          test -f "$binary"

          if [ "$RUNNER_OS" = "macOS" ]; then
            file "$binary"
            expect_macho='${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}'
            file "$binary" | grep -q "Mach-O 64-bit executable $expect_macho"
            # Injection invalidates the upstream signature; the build re-signs
            # ad-hoc. A binary that fails this will be killed by the loader.
            codesign --verify --verbose=2 "$binary"
          fi

          native=1
          if [ "$RUNNER_OS" = "macOS" ] && [ "${{ matrix.arch }}" = "x64" ] && [ "$(uname -m)" = "arm64" ]; then
            # Cross-built Intel binary on an arm64 host: executing it needs
            # Rosetta 2. Probe for it explicitly and record the outcome — the
            # functional gate is enforced whenever it is available.
            if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
              echo "Rosetta 2 available — enforcing functional smoke test."
            else
              native=0
              echo "::warning::Rosetta 2 unavailable on this runner; the x86_64 binary passed its Mach-O arch and ad-hoc signature gates but could not be executed here. Functional coverage for this asset comes from GKOS-Engine-Lite desktop-build, which runs 'kosmos-agent --help' while assembling the Intel .dmg."
            fi
          fi
          if [ "$native" = "1" ]; then
            "$binary" --help | grep -q "protected, read-only note map"
            echo "functional smoke test passed"
          fi

      - name: Collect binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "dist/${{ matrix.expect_asset }}" out/
          ls -la out/

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: kosmos-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          body: |
            Unsigned pre-release sidecar binaries (`kosmos-agent`). See the
            GKOS Engine Desktop install guide for the open-anyway steps
            (macOS right-click → Open / `xattr`; Windows SmartScreen
            "More info → Run anyway").

  # The standalone 3D viewer built in Odenknight/Kosmos-Oden ships alongside the
  # sidecar so a release carries both halves of the desktop viewer story: the
  # loopback API (the binaries above) and the page that consumes it. The HTML is
  # OS-independent, so a single linux job fetches it and attaches it once — no
  # need to duplicate it across the SEA matrix (which would also race the
  # upload). It appends to the same release the matrix legs publish to.
  viewer-asset:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download standalone viewer HTML from Kosmos-Oden
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p viewer
          # Newest `viewer-v*` release, falling back to the tag known-good at
          # authoring time if the query returns nothing.
          TAG="$(gh release list --repo Odenknight/Kosmos-Oden --limit 30 \
                  --json tagName --jq '[.[].tagName | select(startswith("viewer-v"))] | first' \
                || true)"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="viewer-v0.6.9-rc1"
          fi
          echo "Using Kosmos-Oden viewer release: $TAG"
          echo "VIEWER_TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo Odenknight/Kosmos-Oden \
            --pattern vault-kosmos.html --dir viewer --clobber
          test -s viewer/vault-kosmos.html

      - name: Attach viewer HTML to this release
        uses: softprops/action-gh-release@v2
        with:
          files: viewer/vault-kosmos.html
          fail_on_unmatched_files: true
          append_body: true
          body: |

            ---
            `vault-kosmos.html` — the standalone 3D viewer built in
            Odenknight/Kosmos-Oden at ${{ env.VIEWER_TAG }}; consumes this
            sidecar's loopback API
            (`?api=http://127.0.0.1:<port>&token=<bearer>`, `/health` + `/graph`).
