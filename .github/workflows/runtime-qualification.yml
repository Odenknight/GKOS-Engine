name: Historical and current runtime qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-contract-replay:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.node == 23 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
        node: [22, 23, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: historical
          ref: 97ae3560a4fa2e771b60fa63d6dc0349d0b4c864
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: historical/package-lock.json
      - name: Install exact historical dependencies
        working-directory: historical
        run: npm ci --ignore-scripts
      - name: Replay unchanged historical assertions and record actual commands
        shell: bash
        run: node candidate/scripts/runtime-qualification.mjs --historical-checkout historical --output "$RUNNER_TEMP/historical-receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-contract-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/historical-receipt/
          if-no-files-found: error

  current-runtime:
    needs: historical-contract-replay
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.node == 23 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 23, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Odenknight/gkos-standard
          ref: ad10dfe94a024f464430fd243c5a918d03389041
          path: gkos-standard
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Current runtime qualification (source inventory and executed tests)
        shell: bash
        working-directory: candidate
        run: node scripts/runtime-qualification.mjs --output "$RUNNER_TEMP/current-runtime-receipt"
      - name: Upload evidence even when qualification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-runtime-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/current-runtime-receipt/
          if-no-files-found: error
