name: Conformance runner

on: [push, pull_request]

permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/runner/package-lock.json
      - name: Install runner dependencies
        working-directory: conformance/runner
        run: npm ci
      - name: Test runner claim boundaries
        working-directory: conformance/runner
        run: npm test
